# =============================================================================
# SecureVault - Alembic Configuration
# =============================================================================
# This is the Alembic configuration for Flask-Migrate. It lives inside the
# migrations directory, which is the standard Flask-Migrate layout.
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file's directory).
script_location = .

# Template used to generate migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps.
timezone = UTC

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
